name: Build WH Auto APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :mobile-app:assembleDebug

      - name: Rename APK
        run: |
          cp mobile-app/build/outputs/apk/debug/mobile-app-debug.apk WH-Auto-Mobile-v4-Luxury.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WH-Auto-Mobile-v4-Luxury-APK
          path: WH-Auto-Mobile-v4-Luxury.apk
          retention-days: 30
